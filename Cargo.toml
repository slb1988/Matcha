[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "tools/xtask"]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.dependencies]
# internal crates (dependency direction: apps -> gui/script -> session/report -> engines -> formats/vfs/jobs -> core)
bc-core = { path = "crates/bc-core" }
bc-formats = { path = "crates/bc-formats" }
bc-vfs = { path = "crates/bc-vfs" }
bc-jobs = { path = "crates/bc-jobs" }
bc-engine-text = { path = "crates/bc-engine-text" }
bc-engine-dir = { path = "crates/bc-engine-dir" }
bc-engine-table = { path = "crates/bc-engine-table" }
bc-engine-bin = { path = "crates/bc-engine-bin" }
bc-session = { path = "crates/bc-session" }
bc-report = { path = "crates/bc-report" }
bc-script = { path = "crates/bc-script" }
bc-gui = { path = "crates/bc-gui" }
bc-instance = { path = "crates/bc-instance" }
bc-shell = { path = "crates/bc-shell" }

# third party (kept deliberately small; no async runtime, no GUI outside bc-gui)
quick-xml = "0.41"
regex = "1.12"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Time", "Win32_UI_Shell", "Win32_System_IO", "Win32_Globalization", "Win32_Security", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
calamine = { version = "0.38", default-features = false }
# 表格合并写出 xlsx（仅值、公式与数字格式；样式/图表不保真，见 docs/features/table-merge.md）。
rust_xlsxwriter = { version = "0.102", default-features = false }
# 与 calamine / rust_xlsxwriter 共用同一份 zip：只用来从 xlsm 取出 vbaProject.bin 原样带入合并结果。
zip = { version = "9", default-features = false, features = ["deflate"] }
# clipboard 必须开启：否则 egui-winit 退化为进程内假剪贴板，复制/粘贴不经过系统剪贴板。
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }

# 构建期：把 assets/icon/matcha.ico 编进 Windows 可执行文件（其他平台为空操作）。
embed-resource = "3"

[profile.release]
debug = 1
