[package]
name = "bc-shell"
description = "Windows Explorer context-menu integration: static HKCU registry verbs (no COM shell extension), the pending-Left state and the multi-select pairing protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bc-formats = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
# 原生文件对话框的属主窗口句柄（owner.rs）。
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
