[package]
name = "bc-gui"
description = "Virtualized text comparison, editing and application shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bc-core = { workspace = true }
bc-formats = { workspace = true }
bc-vfs = { workspace = true }
bc-jobs = { workspace = true }
bc-engine-bin = { workspace = true }
bc-engine-text = { workspace = true }
bc-engine-table = { workspace = true }
bc-engine-dir = { workspace = true }
bc-session = { workspace = true }
bc-shell = { workspace = true }
bc-script = { workspace = true }
eframe = { workspace = true }
# 读字体度量（与 epaint 同版本，不增加编译量）：对齐编辑器字体与 CJK 回退字体的基线。
skrifa = { version = "0.44", default-features = false, features = ["std"] }

# 路径框右键菜单读取系统剪贴板（egui 只提供写入）。
arboard = { version = "3", default-features = false }
# 系统原生文件/文件夹选择对话框（Windows: IFileOpenDialog）。
rfd = "0.16"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
serde_json = { workspace = true }
