[package]
name = "bc-gui"
description = "Virtualized text comparison, editing and application shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bc-core = { workspace = true }
bc-formats = { workspace = true }
bc-vfs = { workspace = true }
bc-jobs = { workspace = true }
bc-engine-bin = { workspace = true }
bc-engine-text = { workspace = true }
bc-engine-table = { workspace = true }
bc-engine-dir = { workspace = true }
bc-session = { workspace = true }
bc-shell = { workspace = true }
eframe = { workspace = true }

# 路径框右键菜单读取系统剪贴板（egui 只提供写入）。
arboard = { version = "3", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
serde_json = { workspace = true }
